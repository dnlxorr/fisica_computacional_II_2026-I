name: Python Checks

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5 # Updated to v5
      with:
        python-version: "3.12"
        
    - name: Install base dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        
    - name: Install student-specific dependencies
      run: |
        # Loop through every student's python folder
        for python_dir in */python; do
          if [ -d "$python_dir" ]; then
            cd "$python_dir"
            # If the student provided a requirements.txt, install it
            if [ -f "requirements.txt" ]; then
              echo "📦 Installing dependencies for $python_dir"
              pip install -r requirements.txt
            fi
            cd -
          fi
        done

    - name: Lint with flake8
      run: |
        # flake8 can safely run from the root, it will automatically find all .py files in subfolders
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all other errors as warnings.
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest
      run: |
        # Loop through each folder to run tests so relative file paths work correctly
        for python_dir in */python; do
          if [ -d "$python_dir" ]; then
            echo "========================================"
            echo "🧪 Testing $python_dir"
            echo "========================================"
            cd "$python_dir"
            pytest
            cd -
          fi
        done
