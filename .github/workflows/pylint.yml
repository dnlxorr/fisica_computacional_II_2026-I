name: Pylint Checks

on: 
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest # Back to the latest and greatest!
        
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pylint
        
    - name: Analysing the code with pylint
      run: |
        # Tell Git to stop escaping special characters like 'ó'
        git config --global core.quotePath false
        
        # Run Pylint:
        # --errors-only: Fails only on real bugs, not formatting
        # --disable=import-error: Stops Pylint from panicking if numpy/scipy aren't installed
        pylint --errors-only --disable=import-error $(git ls-files '*.py')
